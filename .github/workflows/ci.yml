name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: CLI smoke test
        run: |
          npm run compile
          node dist/cli.js eval/labeled --format sarif --no-fail --output "$RUNNER_TEMP/vulnlens.sarif"
          node -e "const fs = require('fs'); const s = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/vulnlens.sarif', 'utf8')); if (s.version !== '2.1.0' || s.runs[0].results.length === 0) process.exit(1)"

      - name: Package the extension
        run: npx vsce package --allow-missing-repository

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
